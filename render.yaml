# Render Blueprint (PRD 10): the app runs on Render's free Docker web service,
# while PostgreSQL and tree photos live on Supabase (free, persistent).
# Blueprints require a credit card on Render, so we create the free Web Service
# by hand (docs/DEPLOY.md) and keep this file as the reference list of
# variables. Values marked `sync: false` are secrets and never live in the repo.
services:
  - type: web
    name: harvesta
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: Harvesta
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: PHP_CLI_SERVER_WORKERS
        value: "4"

      # Supabase PostgreSQL: use the "Session pooler" connection (IPv4).
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log

      # Supabase Storage (S3 protocol) with a public bucket for tree photos.
      - key: PHOTO_DISK
        value: s3
      - key: PHOTO_DISK_ROOT
        value: photos
      - key: PHOTO_DISK_URL
        sync: false
      - key: PHOTO_S3_ENDPOINT
        sync: false
      - key: PHOTO_S3_REGION
        sync: false
      - key: PHOTO_S3_BUCKET
        value: harvesta-photos
      - key: PHOTO_S3_ACCESS_KEY_ID
        sync: false
      - key: PHOTO_S3_SECRET_ACCESS_KEY
        sync: false
      - key: PHOTO_S3_USE_PATH_STYLE_ENDPOINT
        value: "true"

      # Demo accounts and sample data, created on the first boot.
      - key: SEED_ADMIN_EMAIL
        value: admin@example.com
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_STAFF_EMAIL
        value: staff@example.com
      - key: SEED_STAFF_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "true"
