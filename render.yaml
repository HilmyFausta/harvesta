databases:
  - name: harvesta-db
    databaseName: harvesta
    user: harvesta
    plan: free

services:
  - type: web
    name: harvesta
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: harvesta-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: harvesta-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: harvesta-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: harvesta-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: harvesta-db
          property: password
      - key: DB_SSLMODE
        value: prefer
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: log
      - key: PHOTO_DISK
        value: local
