[package]
name = "hilmyfausta/harvesta"
version = "0.1.10"
description = "Harvesta - Tree & Orchard Management System"

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app" = "."

[[command]]
name = "start"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-c", "/app/php.ini", "-t", "/app/public", "-S", "0.0.0.0:8080", "/app/wasmer-router.php"]
